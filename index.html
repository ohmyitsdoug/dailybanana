<script>
// pick the theme before anything paints: saved choice, else the device setting
(function(){var t;try{t=JSON.parse(localStorage.getItem('snug:theme'))}catch(e){}
  if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;
  // the phone's top bar uses this color: keep it the same as the page, light or dark
  var m=document.getElementById('tc');if(m)m.content=t==='dark'?'#2A1A0E':'#FFF0A0'})();
</script>
<style>
/* Banana for Scale · "A Offset" design: 2px borders, hard offset shadows, banana yellow + dark brown.
   Yellow is a fill with dark brown text on it; --accsh is the yellow shadow tone that shows on each background;
   --acc-text is small bold text that passes 4.5:1 on that theme's background. */
:root,:root[data-theme="light"]{
  --bg:#FFF0A0;--ink:#3B2412;--mut:#6B4F30;--card:#FFFAE0;--line:#E6D38A;
  --acc:#FFD43B;--acc-ink:#3B2412;--acc-text:#8A4B00;--accsh:#B97E00;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#2A1A0E;--ink:#FFF3C9;--mut:#CDB68C;--card:#382415;--line:#4E3622;
  --acc:#FFD43B;--acc-ink:#2A1A0E;--acc-text:#FFD43B;--accsh:#FFD43B;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
a{color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accsh);outline-offset:3px}
.field:focus-within{outline:none}
button[disabled]{opacity:.45;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}

.app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(max(20px,calc(env(safe-area-inset-top) + 12px)) + var(--topx)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
.spacer{flex:1}

/* buttons */
.btn{height:56px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);box-shadow:4px 4px 0 var(--ink);
  font-weight:700;font-size:17px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none}
.btn.main{height:60px;background:var(--ink);color:var(--bg);box-shadow:4px 4px 0 var(--accsh);justify-content:space-between;font-size:18px}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.main:active{box-shadow:2px 2px 0 var(--accsh)}
.btn small{font-weight:500;font-size:14px;opacity:.85}
.sq{height:40px;min-width:40px;border:2px solid var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:0 12px;font-weight:700;font-size:14px}
.sq.icon{padding:0;width:40px}
.tag{display:inline-block;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 10px;font-size:13px;font-weight:700;
  background:var(--acc);color:var(--acc-ink)}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.5px;text-decoration:none;background:none;border:0;padding:0}
.logo .m{display:inline-flex;width:30px;height:30px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);align-items:center;justify-content:center;
  background:var(--card)}
.nav .r{display:flex;gap:8px}
.sun,.moon{display:none}
:root[data-theme="light"] .sun,:root[data-theme="dark"] .moon{display:block}

/* boxes */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border:2px solid var(--ink);padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:22px;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.card{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--card);padding:16px}

/* home */
.daily{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.daily h1{margin:0;font-size:52px;line-height:1;letter-spacing:-2px}
.daily p{margin:0;font-size:16px;max-width:34ch}
.fine{font-size:13px;color:var(--mut)}
.foot{font-size:12px;color:var(--mut);text-align:center}
.kofiw{text-align:center}
.kofi{display:inline-flex;align-items:center;gap:6px;margin:4px 0;padding:8px 14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;box-shadow:3px 3px 0 var(--accsh)}
.kofi:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--accsh)}
.dellink{display:block;margin:28px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px}
.cta{display:flex;flex-direction:column;gap:12px}
.cta2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.cta2 .btn{padding:0 12px;justify-content:center}
.sqr.on.bull.gold{background:var(--card)}
.sqr .hundo{font-size:22px;line-height:1}
.sqr.on.bull.gold{position:relative;overflow:hidden}
.sqr .gb{display:block;width:96%;aspect-ratio:1;margin:-2% 0 -20%;background:url(golden-banana.svg) center/contain no-repeat;flex:none}
.sqr.on.bull.gold{justify-content:flex-end;padding-bottom:3px}
.apsel{flex:1;min-height:44px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700;padding:0 10px}
.apday{border:2px solid var(--ink);background:var(--bg)}
.apday summary{cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px;list-style:none}
.apday summary::-webkit-details-marker{display:none}
.apday summary::after{content:'+';position:absolute;right:14px;top:10px;font-weight:700;font-size:20px}
.apday{position:relative}.apday[open] summary::after{content:'–'}
.apday summary .mut{font-size:13px;padding-right:22px}
.apbody{display:flex;flex-direction:column;gap:12px;padding:0 12px 12px}
.wkhint{margin:-4px 0 0;text-align:center;color:var(--mut);font-size:15px}
#wkmenu:empty{display:none}
.menu>.eyebrow{margin-bottom:-8px}
.codein{height:64px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accsh);background:var(--card);color:var(--ink);font:700 30px/1 inherit;font-family:inherit;letter-spacing:6px;text-transform:uppercase;text-align:center;padding:0 12px;width:100%;box-sizing:border-box}
.codein:focus{outline:3px solid var(--acc);outline-offset:2px}
.codechip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:15px;letter-spacing:2px;padding:4px 10px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.codechip svg{width:16px;height:16px}
.main-col,.side-col{display:flex;flex-direction:column;gap:12px}
.page.home{display:contents}
@media (max-height:720px) and (max-width:1099px){.app:has(.home){gap:12px}.home .daily h1{font-size:44px}}
.howlink{font-size:14px;font-weight:500}
.narrow{display:flex;flex-direction:column;gap:16px}

/* play */
.playtop{display:flex;align-items:center;gap:10px}
.timer{font-size:28px;font-weight:700}
.pts{margin-left:auto}
.bar{height:10px;border:2px solid var(--ink)}
.bar>div{height:100%;background:var(--ink);transition:width .1s linear}
.bar.low>div{background:var(--accsh)}
.ctx{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:500}
.chips span{border:2px solid var(--ink);padding:2px 7px}
.chips span.hi{box-shadow:2px 2px 0 var(--accsh)}
.sqrow{display:flex;justify-content:space-between;gap:4px}
.sqr{flex:1;aspect-ratio:1;max-width:40px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut);box-sizing:border-box}
.sqr span{opacity:.55}
.sqr.end{background:var(--ink);color:var(--bg);border:2px solid var(--ink)}
.sqr.on{border:2px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sqr.hi{box-shadow:3px 3px 0 var(--accsh)}
.sqr.cur{border:2px solid var(--ink);color:var(--ink)} .sqr.cur span{opacity:1}
.sqr.on{font-size:12px;font-variant-numeric:tabular-nums}
.sqr.on.mid{background:#FFD43B;color:#3B2412}
.sqr.on.good{background:#8A5A2B;color:#FFF3C9}
.sqr.on.bull{background:var(--card);color:var(--ink);flex-direction:column;gap:1px;font-size:11px;line-height:1}
.sqr.on.bull{container-type:inline-size} .sqr.on.bull svg{display:block;width:40cqw;height:auto;margin-bottom:3cqw} .sqr.on.bull .n{font-size:24cqw;opacity:1}   /* same proportions as the share image */
.sqr.on.miss{color:var(--mut);box-shadow:none}
.scale{display:flex;flex-direction:column;gap:8px;padding:30px 0 4px}
.track{position:relative;height:12px;border:2px solid var(--ink);background:var(--card)}
.track .tick{position:absolute;top:-10px;bottom:-10px;width:3px;margin-left:-1.5px;background:var(--accsh)}
.pin{position:absolute;top:-34px;transform:translateX(-50%);white-space:nowrap}
.pin span{display:inline-block;border:2px solid var(--ink);background:var(--bg);padding:1px 7px;font-size:13px;font-weight:700;box-shadow:2px 2px 0 var(--accsh)}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;margin-left:-1px;background:var(--ink)}
.mini{display:block;position:relative;height:6px;margin:14px 6px 8px;background:var(--line)}
.mini .c{position:absolute;left:50%;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--accsh)}
.mini .you{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--ink);border-radius:50%}
.mini .avg{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--acc);border:2px solid var(--ink);transform:rotate(45deg)}
.mlegend{font-size:12px;color:var(--mut);display:flex;gap:14px;align-items:center;margin:0 0 4px}
.mlegend i{display:inline-block;vertical-align:middle;margin-right:5px}
.scale-ends{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.prow.round{align-items:flex-start}
.prow .t .rare{color:var(--acc-text);font-weight:700}
.reveal .score{font-size:48px}
.note .rare{color:var(--acc-text);font-weight:700}
.sqrow.seven{justify-content:flex-start;gap:6px}
.play .sqrow.seven{justify-content:center}
.play .fb{justify-content:center}
.sqrow.seven .sqr{max-width:56px}
.ask{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:4px 0}
.ask b{font-size:34px;line-height:1.05;letter-spacing:-1px}
.ask .lab{font-size:13px;letter-spacing:1.5px;color:var(--mut);text-transform:uppercase}
.ask .lab+b{margin-bottom:6px}
.nest{display:flex;justify-content:center}
.outer{position:relative;width:min(240px,70vw);aspect-ratio:1;border:3px solid var(--ink);background:var(--card);display:flex;align-items:flex-end;justify-content:flex-start;padding:6px;box-sizing:border-box}
.olab{position:absolute;top:-24px;left:0;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}
.inner{background:var(--acc);color:var(--acc-ink);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:visible;min-width:14px;min-height:14px;box-sizing:border-box;transition:width .5s cubic-bezier(.2,.8,.2,1),height .5s cubic-bezier(.2,.8,.2,1)}
.inner{position:relative}
.inner span{font-size:13px;font-weight:700;white-space:nowrap;padding:0 4px}
.inner.tiny span{position:absolute;left:calc(100% + 6px);bottom:0;color:var(--ink);padding:0}
.nest{padding-top:22px}
/* floating 16-bit bananas behind everything */
.bgb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
/* a solid strip behind the iPhone status bar, so nothing scrolls under Apple's fade */
.app{--topx:0px}
@media (max-height:700px){.app{--topx:8px}}
.safetop{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bg);z-index:40;pointer-events:none}
.bgb span{position:absolute;opacity:.13;animation:floaty 9s ease-in-out infinite;animation-delay:calc(var(--d) * -1)}
:root[data-theme="dark"] .bgb span{opacity:.09}
.nobgb .bgb{display:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(8deg)}}
.app{position:relative;z-index:1}
.answer{font-size:18px}
.answer b{font-size:22px}
.calm .bgb span{animation:none}
@media (prefers-reduced-motion:reduce){.bgb span{animation:none}}
.sqlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.ends{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;font-size:22px;letter-spacing:-.5px}
.ends .mid{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0;text-align:center}
.lead{font-size:18px!important;font-weight:500}
.playtop .bar{flex:1;height:10px;margin:0 4px}
.prow .pct{font-size:12px;color:var(--mut)}
.prow .pct.rare,.fb .rare{color:var(--acc-text);font-weight:700}
.prow.endrow{font-weight:700;font-size:16px}
.prow.gap{border-bottom-style:dashed}
.prow.gap .w{color:var(--mut)}
.prow.bonus{font-size:14px}
.big{font-size:42px;line-height:1;font-weight:700;letter-spacing:-1.5px;overflow-wrap:anywhere}
.field{position:relative;display:flex;align-items:center;gap:8px;height:56px;padding:0 14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accsh);
  font-size:22px;font-weight:500;background:var(--card);cursor:text}
.field .go{position:relative;z-index:2;margin-left:auto;margin-right:-8px;height:40px;padding:0 16px;border:2px solid var(--ink);background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.field input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;background:transparent}
.mirror{white-space:pre;overflow:hidden}
.caret{width:2px;height:24px;background:var(--ink);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fb{min-height:28px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fb b{font-size:20px}
.fb span{font-size:13px;color:var(--mut)}
.fb .rare{color:var(--acc-text);font-weight:700}
.fb.no span{color:var(--ink);font-size:14px;font-weight:500}
.count{font-size:44px;font-weight:700;letter-spacing:-1px}
.side{display:none}
.keep{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}

/* results */
.score{font-size:56px;line-height:.95;letter-spacing:-2px;font-weight:700}
.sumrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sumrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:13px;color:var(--mut);text-align:right}
.sumrow .r b{color:var(--ink);font-size:18px}
.path{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.prow .i{width:18px;font-size:13px;color:var(--mut)}
.prow .w{flex:1;min-width:0}
.prow .t{font-size:12px;color:var(--mut)}
.prow .rare{font-size:12px;font-weight:700;color:var(--acc-text)}
.prow.start{color:var(--mut)}
.range{border:2px solid var(--ink);padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.range div{display:flex;flex-direction:column}
.range b{font-size:20px;line-height:1.2}
.range span{font-size:12px;color:var(--mut)}
.share{border:2px dashed var(--mut);padding:10px 12px;font-size:14px;line-height:1.5;white-space:pre-wrap;user-select:all}
.badge-new{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accsh);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.badge-new span{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ladder{display:flex;flex-direction:column;font-size:15px}
.ladder div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.ladder .you{font-weight:700}
.ladder .x{color:var(--mut)}

/* menu, help, admin */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head h2{margin:0;font-size:34px;letter-spacing:-1px;line-height:1}
.list{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 2px;border:0;border-bottom:1px solid var(--line);
  background:transparent;font-size:15px;text-align:left;width:100%;color:inherit;text-decoration:none}
.lrow b{font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border:2px dashed var(--line);padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--mut)}
.badge b{font-size:15px}
.badge.on{border:2px solid var(--ink);color:var(--ink)}

.badge.on .bi{filter:none;opacity:1}
.badge .bt{display:flex;flex-direction:column;gap:2px;min-width:0}

.tip{position:absolute;z-index:30;max-width:260px;display:flex;gap:8px;align-items:flex-start;background:var(--ink);color:var(--bg);padding:10px 12px;font-size:14px;line-height:1.4;box-shadow:4px 4px 0 var(--accsh)}
.tip svg{flex:none;margin-top:1px}
button.stat{font:inherit;color:inherit;background:var(--bg);text-align:left;cursor:pointer}
.chal{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accsh);background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chal h3{margin:0;font-size:18px}
.chal .linkbox{display:flex;gap:8px;align-items:stretch}
.chal .linkbox code{flex:1;min-width:0;border:2px dashed var(--line);padding:10px;font-size:14px;overflow-wrap:anywhere;font-family:inherit}
.board{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.board div{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}
.board .n{width:18px;color:var(--mut)}.board .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .you{font-weight:700}

// ---------- data ----------

const question=q=>`Approximately how many ${q.A.plural} ${q.B.dim} is ${the(q.B)}?`;
// a friendly rounded answer: 61, 140, 1,900, 13,000
function nice(n){if(n<10)return Math.round(n*10)/10;const p=10**Math.max(0,Math.floor(Math.log10(n))-1);return Math.round(n/p)*p}
// the answer players see, and (from Nov 5) the one they're scored against: tenths under 100, whole numbers from 100
const SCORE_V2='2026-11-05';
const shownAns=n=>n<100?Math.round(n*10)/10:Math.round(n);   // (an earlier draft of the Nov 5 rounding; guesses still display this way)
// from Nov 5 (v1.1): one decimal under 10, whole numbers to 99, then the nearest 10, 50 or 500
const SCORE_V3='2026-11-05';
const roundAns=n=>n<10?Math.round(n*10)/10:n<100?Math.round(n):n<1000?Math.round(n/10)*10:n<10000?Math.round(n/50)*50:Math.round(n/500)*500;
// lengths for the reveal, metric with imperial alongside
function len(cm){
  const m=cm>=100000?`${fmt(nice(cm/100000))} km`:cm>=100?`${fmt(nice(cm/100))} m`:`${nice(cm)} cm`;
  const ft=cm/30.48,i=cm>=30.48*5280?`${fmt(nice(ft/5280))} mi`:ft>=3?`${fmt(nice(ft))} ft`:`${nice(cm/2.54)} in`;
  return`${m} (${i})`;
}
// what people type: 60, 1,200, 1.5k, 2m, ~300
function parseGuess(raw){
  const s=String(raw).toLowerCase().replace(/[,\s~≈]/g,'');
  const m=s.match(/^(\d*\.?\d+)(k|m)?$/);if(!m)return null;
  const n=parseFloat(m[1])*(m[2]==='k'?1e3:m[2]==='m'?1e6:1);
  return n>0&&isFinite(n)?n:null;
}

// ---------- scoring ----------
// points = how accurate you were, as a percent: the smaller of (guess, answer) over the bigger.
// Half the answer scores 50, twice the answer scores 50, 5x off scores 20, 10x off scores 10.
function judge(guess,q){
  const t=q.v2?q.show:q.ans;   // from Nov 5, typing the answer shown on screen scores exactly 100
  const p=Math.round(MAX_PTS*Math.min(guess,t)/Math.max(guess,t));
  return{guess,p,off:guess/t};
}
const mark=p=>p>=100?'💯':p>=90?'🍌':p>=70?'🟫':p>=40?'🟨':'⬜';   // darker the closer you get, then the banana, then 💯 for exact (drawn in the app as a golden banana)
// small tip under the bananas box
function banTip(el){
  const old=document.getElementById('banpop');if(old){old.remove();el.setAttribute('aria-expanded','false');return}
  const t=document.createElement('div');t.id='banpop';t.className='tip';t.setAttribute('role','tooltip');
  t.innerHTML=`${BANANA(18)}<span>You earn a banana for every daily round you score <b>90 or more</b>, meaning your guess was within about 10% of the answer.</span>`;
  document.body.appendChild(t);const b=el.getBoundingClientRect(),w=t.offsetWidth;
  t.style.left=Math.max(12,Math.min(innerWidth-w-12,b.right+scrollX-w))+'px';t.style.top=(b.bottom+scrollY+10)+'px';
  el.setAttribute('aria-expanded','true');
  const off=()=>{t.remove();el.setAttribute('aria-expanded','false');removeEventListener('click',off);removeEventListener('keydown',esc_);removeEventListener('resize',off)};
  const esc_=e=>{if(e.key==='Escape')off()};
  setTimeout(()=>{addEventListener('click',off);addEventListener('keydown',esc_);addEventListener('resize',off)});
}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
const markA=a=>!a||a.guess==null?'❌':mark(a.p||0);   // ❌ = no guess (time ran out)
const LEGEND='⬜ under 40 · 🟨 40+ · 🟫 70+ · 🍌 90+ · 💯 exact · ❌ no guess';
function offLabel(a){
  if(!a||a.guess==null)return'Out of time.';
  if(a.p>=MAX_PTS)return'Spot on! 💯';
  const r=a.off,pc=Math.round(Math.abs(r-1)*100);
  if(r>1)return r>=2?`${(Math.round(r*10)/10)}× too high.`:`${pc}% too high.`;
  return 1/r>=2?`${(Math.round(10/r)/10)}× too low.`:`${pc}% too low.`;
}

function puzzleFor(d){const it=v=>typeof v==='object'?v:ITEMS[v],dd=d.date||todayISO(),v2=dd>=SCORE_V2,v3=dd>=SCORE_V3;
  return{...d,qs:d.rounds.map(x=>{const A=it(x.a),B=it(x.b),ans=B.cm/A.cm;return{A,B,ans,v2,show:v3?roundAns(ans):v2?shownAns(ans):nice(ans)}})}}
// a quick game left mid-way: saved at the end of each round (and on pause), on the phone and, when signed in, the account,
// so the home screen offers Resume. A finished or replaced game leaves a 'cleared' marker so other devices drop it too.
function quickLive(){const v=store.get('qlive',null);if(!v||v.cleared||!Array.isArray(v.rounds))return null;
  const unit=v.chal&&v.chal.weekend&&v.chal.weekend.unit,rounds=fromNames(v.rounds,unit);if(rounds.some(x=>x.a==null||x.b==null))return null;
  return{r:{...puzzleFor({rounds,date:v.date}),n:0,quick:true,date:v.date,chal:v.chal||null},answers:v.answers,score:v.score,i:v.i,left:v.left,pauses:0,phase:v.phase,running:v.running,end:v.end}}
function quickKeep(){if(!S||!S.r.quick)return;const left=S.clock?Math.max(0,S.end-Date.now()):S.left;
  store.set('qlive',{at:Date.now(),rounds:toNames(S.r.rounds),date:S.r.date,chal:S.r.chal||null,answers:S.answers,score:S.score,i:S.i,left,phase:S.phase,running:!!S.clock,end:S.clock?S.end:null})}
const quickDrop=()=>store.set('qlive',{cleared:true,at:Date.now()});
const pick=a=>a[Math.floor(Math.random()*a.length)];
// skips any question from a daily (past or future) and the last 300 quick-play questions on this device
function randomRounds(){
  const units=ITEMS.filter(i=>i.unit),used=new Set(),k=(a,b)=>a+'>'+b;
  const avoid=new Set([...DAILIES.flatMap(d=>d.rounds.map(x=>k(x.a,x.b))),...store.get('seen',[])]);
  // only 1 or 2 rounds use a hyper-specific item (landmarks, niche gear), like the dailies
  const nSpec=Math.random()<2/3?1:2,want=new Set();while(want.size<nSpec)want.add(Math.floor(Math.random()*BUCKETS.length));
  const core=ITEMS.filter(i=>i.core);
  const out=BUCKETS.map(([lo,hi],bi)=>{
    const coreB=!want.has(bi)&&Math.random()<2/3;   // most everyday rounds measure a well-known thing too
    for(let t=0;t<20000;t++){const a=pick(units),b=coreB&&t<10000?pick(core):pick(ITEMS),r=b.cm/a.cm,sp=!!(a.x||b.x);
      if(a.id!==b.id&&!used.has(a.id)&&!used.has(b.id)&&r>=lo&&r<=hi&&(t>15000||(!avoid.has(k(a.id,b.id))&&sp===want.has(bi)))){used.add(a.id);used.add(b.id);return{a:a.id,b:b.id}}}
    return{a:units[0].id,b:ITEMS[ITEMS.length-1].id}});
  store.set('seen',[...out.map(x=>k(x.a,x.b)),...store.get('seen',[])].slice(0,300));
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}   // any order, not small to big
  return out;
}
// challenges travel by item name, so they keep working if the item list grows
const BYNAME=()=>Object.fromEntries(ITEMS.map(i=>[i.name,i.id]));
const nameOf=v=>typeof v==='object'?v.name:ITEMS[v].name;
const toNames=rounds=>rounds.map(x=>({a:nameOf(x.a),b:nameOf(x.b)}));
// a weekend challenge measures in its own unit, which isn't in the item list
const fromNames=(rounds,unit)=>{const m=BYNAME(),f=n=>unit&&n===unit.name?unit:m[n];return rounds.map(x=>({a:f(x.a),b:f(x.b)}))};
const chalName=c=>c.weekend?`Weekend challenge · ${esc(c.weekend.theme||(c.weekend.unit?W(c.weekend.unit.plural):''))}`:`${esc(c.host)}'s challenge`;
function quick(chal){
  const wk=chal&&chal.weekend||null;
  const rounds=chal?fromNames(chal.rounds,wk&&wk.unit):randomRounds();
  if(rounds.some(x=>x.a==null||x.b==null))return alertBox('This challenge uses items this version of the game doesn\'t have.');
  leave({...puzzleFor({rounds}),n:0,quick:true,date:todayISO(),chal:chal?{code:chal.code,host:chal.host,...(wk?{weekend:wk}:{})}:null});
}
const quickList=()=>store.get('quick',[]);
const quickTotalsFromList=()=>{const l=quickList();return{g:l.length,t:l.reduce((a,q)=>a+(q.total||0),0),b:l.reduce((a,q)=>a+(q.answers||[]).filter(x=>(x&&x.p||0)>=90).length,0)}};

// v1.1 scoring: games from Nov 5 played before the update are scored again with the new rounding (once)
function rescoreV3(){
  if(store.get('rescore3',false))return;let changed=false;
  const fix=(r,res)=>{if(!res||!Array.isArray(res.answers))return false;let t=0,ch=false;
    res.answers.forEach((a,i)=>{if(a&&a.guess!=null&&r.qs[i]){const p=judge(+a.guess,r.qs[i]).p;if(p!==a.p){a.p=p;a.off=+a.guess/r.qs[i].show;ch=true}}t+=a&&a.p||0});
    if(ch){res.total=t;res.v3=true}return ch};
  DAILIES.filter(d=>d.date>=SCORE_V3&&d.date<=TODAY.date).forEach(d=>{const res=saved(d.n),r=puzzleFor(d);if(fix(r,res)){awardBadges(res,r);store.set('v07:'+d.n,res);changed=true}});
  const ql=quickList(),before=quickTotalsFromList();ql.forEach(q=>{if(!q.rounds||!q.at)return;const dt=new Date(q.at),iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;if(iso<SCORE_V3)return;
    const rounds=fromNames(q.rounds,q.chal&&q.chal.weekend&&q.chal.weekend.unit);if(rounds.some(x=>x.a==null||x.b==null))return;if(fix(puzzleFor({rounds,date:iso}),q))changed=true});
  if(changed){store.set('quick',ql);const after=quickTotalsFromList(),qs=store.get('qstats',null);if(qs){qs.t+=after.t-before.t;qs.b+=after.b-before.b;store.set('qstats',qs)}pushSync()}
  store.set('rescore3',true);
}
function testerCheck(){if(SESSION&&earnBadge('linked'))pushSync();if(TODAY&&TODAY.n<=PLAYTEST_LAST&&playedDailies().length&&earnBadge('tester'))pushSync()}
const shownBadges=have=>BADGES.filter(b=>!b.secret||have[b.id]);
const badgeCount=have=>`${shownBadges(have).filter(b=>have[b.id]).length}/${shownBadges(have).length}`;
function earnBadge(id){const have=store.get('badges',{});if(have[id])return false;have[id]=todayISO();store.set('badges',have);return true}
function playedDailies(){return DAILIES.filter(d=>d.date<=TODAY.date).map(d=>({d,res:saved(d.n)})).filter(x=>x.res)}
function streak(){ // days in a row with a played daily, counting back from today (or yesterday if today isn't played yet)
  const played=new Set(playedDailies().map(x=>x.d.date));let n=0,day=new Date(TODAY.date+'T12:00');
  if(!played.has(TODAY.date))day.setDate(day.getDate()-1);
  const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  while(played.has(iso(day))){n++;day.setDate(day.getDate()-1)}return n;
}
function awardBadges(res,r){
  const have=store.get('badges',{}),got=[],ps=res.answers.map(a=>a.p||0);
  const earn=(id,ok)=>{if(ok&&!have[id]){have[id]=todayISO();got.push(id)}};
  const biggest=r.qs.reduce((b,q,i)=>q.ans>r.qs[b].ans?i:b,0);
  const smallest=r.qs.reduce((b,q,i)=>q.ans<r.qs[b].ans?i:b,0);
  earn('first',true);
  earn('bull',ps.some(p=>p>=95));
  earn('golden',ps.some(p=>p>=100)&&r.date>=SCORE_V2);   // an exact guess (exact only became reliably 100 on Nov 5)
  earn('triple',ps.filter(p=>p>=90).length>=3);
  earn('sharp',ps.length===ROUNDS&&ps.every(p=>p>=70));
  earn('big',ps[biggest]>=90);
  earn('small',ps[smallest]>=90);
  earn('bunch',res.total>=500);
  earn('streak7',streak()>=7);
  earn('tester',r.n<=PLAYTEST_LAST);
  store.set('badges',have);return got;
}

// ---------- rounds ----------
function leave(r,resume){
  // open the keyboard now, inside the tap, so phones allow it; the real input takes focus once the round screen exists
  document.getElementById('keep').focus();
  const els=[...app.querySelectorAll('.in')].filter(el=>!el.parentElement.closest('.in'));
  els.forEach((el,i)=>{el.classList.remove('in');el.style.setProperty('--d',Math.min(i,8));el.classList.add('out')});
  setTimeout(()=>startGame(r,resume),reduced()?0:250+Math.min(els.length,8)*35);
}
function saveLive(){ // what's needed to resume, and to stop a reload from restarting a round
  if(S&&S.r.quick)return quickKeep();
  if(!S)return;
  const left=S.clock?Math.max(0,S.end-Date.now()):S.left;
  store.set('live:'+S.r.n,{answers:S.answers,score:S.score,i:S.i,left,pauses:S.pauses,phase:S.phase,running:S.live,end:S.clock?S.end:null});
}
function startGame(r,resume){
  if(r.quick&&!resume)quickDrop();
  S={r,i:0,answers:[],score:0,left:ROUND_SECONDS*1000,pauses:0,phase:'play',live:false,clock:false,end:0,
     ...(resume?{answers:resume.answers,score:resume.score,i:resume.i,left:resume.left,pauses:resume.pauses,phase:resume.phase}:{})};
  // closed mid-question without pausing: the clock kept running while you were away
  if(resume&&resume.running&&resume.end&&S.phase==='play'){
    const rem=resume.end-Date.now();
    if(rem<=1000){S.answers=[...S.answers];S.answers[S.i]={guess:null,p:0,t:ROUND_SECONDS*1000};S.phase='reveal';S.left=ROUND_SECONDS*1000;S.missed=true;saveLive();if(r.quick)pushSync()}
    else{S.left=rem;S.resumeRunning=true}
  }
  if(!resume)log('start',{mode:r.quick?'quick':'daily',puzzle:r.quick?null:r.n,chal:!!r.chal,device:DEVICE});   // for the admin's starts and completion rate
  S.phase==='reveal'?showReveal():showQuestion();
  if(S.missed){S.missed=false;toast('Time ran out on that question while you were away')}
  else if(S.resumeRunning){S.resumeRunning=false;startClock()}   // the round picks up with the time that was left
}
function showQuestion(){
  const q=S.r.qs[S.i];S.phase='play';S.clock=false;S.live=false;
  app.innerHTML=`<div class="page play">
    <div class="main-col" style="display:flex;flex-direction:column;gap:10px">
      <div class="playtop in" style="--d:0">
        <button class="sq icon" id="pause" aria-label="Pause">${ICON.pause}</button>
        <span class="timer num" id="t">0:${String(Math.ceil(S.left/1000)).padStart(2,'0')}</span>
        <div class="bar" id="bar"><div style="width:${100*S.left/(ROUND_SECONDS*1000)}%"></div></div>
        <span class="tag pts num">${S.i+1}/${ROUNDS} · ${fmt(S.score)}</span>
      </div>
      <div class="in" style="--d:1">${squares(S.answers,S.i)}</div>
      <div class="ask in" style="--d:1"><span class="lab">Approximately how many</span><b>${esc(q.A.plural)}</b><span class="lab">${esc(q.B.dim)} is</span><b>${esc(the(q.B))}?</b></div>
      ${S.r.chal&&S.r.chal.weekend&&((S.r.chal.weekend.hints||[])[S.i]||S.r.chal.weekend.hint)?`<p class="wkhint in" style="--d:1">(${esc((S.r.chal.weekend.hints||[])[S.i]||S.r.chal.weekend.hint)})</p>`:''}
      <form id="f" class="in" style="--d:2" autocomplete="off">
        <label for="g" class="field"><span class="mut">≈</span><span class="mirror num" id="m"></span><span class="caret"></span>
          <button type="submit" class="go" id="go" aria-label="Enter guess">Enter</button>
          <input id="g" aria-label="${esc(question(q))}" inputmode="decimal" enterkeyhint="go" maxlength="14" autocomplete="off"></label>
      </form>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
  </div>`;
  const g=document.getElementById('g');
  // the clock starts at the first keystroke, or a moment after the round appears
  g.oninput=()=>{document.getElementById('m').textContent=g.value;if(S&&!S.clock)startClock()};
  g.onfocus=()=>{if(!matchMedia('(min-width:1100px)').matches){window.scrollTo(0,0);setTimeout(()=>window.scrollTo(0,0),300)}};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();if(!S)return;if(!S.clock)startClock();submit(g.value);if(S&&S.phase==='play'){g.value='';g.oninput();g.focus()}};
  document.getElementById('go').onpointerdown=e=>e.preventDefault();   // keep the keyboard open
  document.getElementById('pause').onclick=pause;
  g.focus();
  const fb=document.getElementById('fb');
  if(!reduced()){fb.className='fb pop';fb.innerHTML=`<span class="count">Round ${S.i+1}</span>`}
  setTimeout(()=>{if(S&&S.phase==='play'&&!S.clock)startClock()},HEADSTART_MS);
  if(!S.r.quick)saveLive();
}
function startClock(){
  if(!S||S.clock||S.phase!=='play')return;
  S.clock=true;S.live=true;S.end=Date.now()+S.left;
  saveLive();if(S.r.quick)pushSync();   // the deadline is saved, so closing the app doesn't stop the clock
  const fb=document.getElementById('fb');if(fb&&fb.querySelector('.count'))fb.innerHTML='';
  let n=0;
  tick=setInterval(()=>{
    if(!S||S.phase!=='play')return clearInterval(tick);
    const left=Math.max(0,S.end-Date.now()),s=Math.ceil(left/1000);
    document.getElementById('t').textContent=`0:${String(s).padStart(2,'0')}`;
    const bar=document.getElementById('bar');
    bar.firstElementChild.style.width=(left/(ROUND_SECONDS*10))+'%';
    bar.classList.toggle('low',s<=5);

    if(!left)endRound(null);
  },100);
}
function pause(){
  if(!S)return;
  const playing=S.phase==='play';
  if(playing){S.left=S.clock?Math.max(0,S.end-Date.now()):S.left;clearInterval(tick)}
  if(S.r.quick){S.clock=false;quickKeep();pushSync();S=null;showStart();return}
  if(playing){
    if(S.pauses>=MAX_PAUSES){
      const b=document.getElementById('pause');
      if(!b.dataset.armed){b.dataset.armed='1';S.end=Date.now()+S.left;say('Pausing again ends your daily. Tap pause once more to end it.');setTimeout(()=>{if(b)delete b.dataset.armed},4000);return}
      return finish('paused');
    }
    S.pauses++;
  }
  S.clock=false;S.live=false;saveLive();S=null;showStart();
}
function say(msg){
  const fb=document.getElementById('fb');if(!fb)return;
  fb.className='fb pop no';fb.innerHTML=`<span>✕ ${esc(msg)}</span>`;
}
function submit(raw){
  if(!raw.trim()||!S||!S.live||S.phase!=='play')return;
  const n=parseGuess(raw);
  if(n==null)return say('Type a number, like 40, 1,200 or 3.5k.');
  endRound(judge(n,S.r.qs[S.i]));
}
function endRound(a){
  clearInterval(tick);
  const ans=a||{guess:null,p:0};
  ans.t=Math.round(ROUND_SECONDS*1000-(S.clock?Math.max(0,S.end-Date.now()):S.left));   // time spent on this round
  S.answers[S.i]=ans;S.score+=ans.p||0;
  S.phase='reveal';S.clock=false;S.live=false;S.left=ROUND_SECONDS*1000;
  saveLive();if(S.r.quick)pushSync();showReveal();
}
// where the guess landed: the answer in the middle, each side counts down from 100 points to 0 at the edge,
// so the distance from the middle is exactly the points lost
const posOf=(g,ans)=>g<=ans?50*g/ans:100-50*ans/g;   // same as the reveal scale: the middle is the answer
function guessScale(q,a){
  const pos=a&&a.guess!=null?(a.guess<=q.ans?50*a.guess/q.ans:100-50*q.ans/a.guess):null;
  return`<div class="scale">
    <div class="track"><span class="tick" style="left:50%"></span>${pos!=null?`<div class="pin you" style="left:${pos.toFixed(1)}%"><span>${fmt(q.v2?shownAns(a.guess):nice(a.guess))}</span></div>`:''}</div>
    <div class="scale-ends"><span class="mut">too low</span><b>${fmt(q.show)}</b><span class="mut">too high</span></div>
  </div>`;
}
function showReveal(){

document.addEventListener('keydown',e=>{

// ---------- results ----------
function finish(why){
  clearInterval(tick);
  if(!S)return;
  const R=S;S=null;
  document.activeElement&&document.activeElement.blur();
  const r=R.r;
  while(R.answers.length<ROUNDS)R.answers.push({guess:null,p:0});
  const total=R.answers.reduce((t,a)=>t+(a.p||0),0);
  const res={why,answers:R.answers,total,pauses:R.pauses,at:Date.now()};
  if(!r.quick){
    store.del('live:'+r.n);
    store.set('v07:'+r.n,res);
    res.badges=awardBadges(res,r);if(res.badges.length)store.set('v07:'+r.n,res);
    pushSync();stale('st:'+r.n);
    log('play',{puzzle:r.n,points:R.answers.map(a=>a.p||0),guesses:R.answers.map(a=>a.guess==null?null:+a.guess),score:total,ms:R.answers.reduce((t,a)=>t+(a.t||0),0),device:DEVICE});
  }else{
    quickDrop();
    Object.assign(res,{id:'q'+Date.now().toString(36),at:Date.now(),rounds:toNames(r.rounds),chal:r.chal||null,own:false});
    res.badges=[];saveQuick(res);pushSync();
    {const t=store.get('qstats',null);if(t){t.g++;t.t+=total;t.b+=R.answers.filter(a=>(a.p||0)>=90).length;store.set('qstats',t)}else store.set('qstats',quickTotalsFromList())}   // the list already includes this game   // quick games and challenges don't earn the daily badges
    log('quick',{score:total,points:R.answers.map(a=>a.p||0),chal:!!res.chal,ms:R.answers.reduce((t,a)=>t+(a.t||0),0),device:DEVICE});
    if(res.chal){showResults(r,res);postChallenge(res).then(()=>chalBox(res));return}
  }
  showResults(r,res);
}

// With 12+ players we use their real scores; before that, an estimate from a simulated crowd whose guesses
// get wilder as the answers get bigger (seeded by the daily, so everyone sees the same estimate).
const REAL_AFTER=12;
function simCrowd(r){
  let t=(r.n+1)*2654435761>>>0;const rnd=()=>{t+=0x6D2B79F5;let x=t;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296};

  const sig=r.qs.map(q=>0.22+0.07*Math.max(0,Math.log10(q.ans)));
  const totals=[],rounds=r.qs.map(()=>[]);
  for(let k=0;k<3000;k++){const skill=Math.exp(0.35*norm());let tot=0;
    r.qs.forEach((q,i)=>{const p=rnd()<0.03?0:Math.round(100*10**-Math.abs(norm()*sig[i]*skill));rounds[i].push(p);tot+=p});totals.push(tot)}
  return{players:0,totals,rounds};
}

async function chalApi(body){

  const r=await fetch(CH,{method:body?'POST':'GET',headers:{'content-type':'application/json',...authHdr()},body:body?JSON.stringify({device:DEVICE,...body}):undefined});

// Server data (rankings, challenges, facts) is kept in memory and on the device, so a screen opens with the last
// numbers already there. Anything older than its time limit is still shown at once, then refreshed in the
// background; if the fresh copy differs, the screen that shows it fills itself in again.
const CACHE=new Map(),KEEP=/^(st:|ch:|host$|facts$)/;
(()=>{try{const old=Date.now()-3*864e5;for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);
  if(k&&k.startsWith('snug:c:')){const v=store.get(k.slice(5),null);if(!v||v.at<old)localStorage.removeItem(k)}}}catch(_){}})();
function cached(key,ms,fn){
  let c=CACHE.get(key);
  if(!c&&KEEP.test(key)){const s=store.get('c:'+key,null);if(s&&s.v!=null){c={at:s.at,v:s.v,p:Promise.resolve(s.v)};CACHE.set(key,c)}}
  if(c&&(Date.now()-c.at<ms||c.busy))return c.p;
  const had=c&&c.v!=null?c:null;
  const req=fn().catch(()=>null).then(v=>{
    if(v==null){if(had)had.busy=false;else CACHE.delete(key);return had?had.v:null}
    const same=had&&JSON.stringify(had.v)===JSON.stringify(v);
    CACHE.set(key,{at:Date.now(),v,p:Promise.resolve(v)});
    if(KEEP.test(key))try{store.set('c:'+key,{at:Date.now(),v})}catch(_){}
    if(had&&!same)refill(key);
    return v});
  if(had){had.busy=true;return had.p}   // show the last copy now, refresh behind it
  CACHE.set(key,{at:0,p:req,busy:true});return req;
}

  if(key.startsWith('st:')&&SHOWN&&!SHOWN.r.quick&&'st:'+SHOWN.r.n===key&&document.getElementById('rank'))showRank(SHOWN.r,SHOWN.res);
  if((key.startsWith('ch:')||key==='host')&&SHOWN&&SHOWN.r.quick&&document.getElementById('chalbox'))chalBox(SHOWN.res);

      ${c.open&&!played?`${nameNote()}<button class="btn main" id="startch"><span>Start challenge</span><span aria-hidden="true">→</span></button>`
        :`<span class="note">${c.open?'You\'ve already played this one.':'This challenge has closed.'}</span><button class="btn" id="viewch">See the scoreboard</button>`}</div>`;
    const st=document.getElementById('startch');if(st)st.onclick=()=>quick(c);
    const v=document.getElementById('viewch');if(v)v.onclick=()=>showChallenge(c.code);
  };
}
// ---------- the weekend challenge: open, counting down (on the player's own Saturday), or last weekend's ----------
// it opens 12am Eastern on Saturday, so players whose Saturday starts earlier (Europe, Asia) see a countdown until then
const wkSoon=w=>!!w&&!w.open&&!!w.next&&new Date().getDay()===6&&w.next.opens>Date.now()-30*60e3;
let wkTick=null;
function wkCountdown(w,id,fmtFn){clearInterval(wkTick);
  const upd=()=>{const el=document.getElementById(id);if(!el){clearInterval(wkTick);return}const ms=w.next.opens-Date.now();
    if(ms<=0){el.textContent=fmtFn('starting');clearInterval(wkTick);CACHE.delete('wk');setTimeout(()=>{if(document.getElementById(id))(document.getElementById('wkcard')?weekendCard:weekendMenu)()},90e3);return}
    el.textContent=fmtFn(ms<3600e3?`${Math.floor(ms/60000)}m ${String(Math.floor(ms/1000)%60).padStart(2,'0')}s`:leftLabel(ms))};
  upd();wkTick=setInterval(upd,1000)}
function weekendCard(){weekendNow().then(w=>{const el=document.getElementById('wkcard');if(!el||!w)return;
  if(wkSoon(w)){el.innerHTML=`<div class="chal in" style="--d:1"><span class="eyebrow">This weekend</span><h3>Weekend challenge</h3>
      <span class="note">A new themed challenge: 6 questions, each measured with something from a surprise theme. Open until midnight Pacific on Sunday.</span>
      <div class="btn" role="status" aria-live="polite" style="cursor:default;justify-content:center;background:var(--acc);color:#2A1A0E"><span id="wkcd">Starting in…</span></div></div>`;
    return wkCountdown(w,'wkcd',t=>t.startsWith('starting')?'Starting any moment…':`Starting in ${t}`)}
  if(!w.code)return;
  el.innerHTML=`<div class="chal in" style="--d:1"><span class="eyebrow">${w.open?'This weekend':'Last weekend'}</span><h3>${esc(w.theme)}</h3>
    <span class="note">${w.open?`6 questions, a different unit each time · closes in ${leftLabel(w.closes-Date.now())}`:`${esc(w.theme)} · closed`}</span>
    <button class="btn ${w.open?'main':''}" id="wkgo"><span>${w.open?'Play the weekend challenge':'See the final scoreboard'}</span><span aria-hidden="true">→</span></button></div>`;
  document.getElementById('wkgo').onclick=async()=>{if(!w.open)return showChallenge(w.code);const c=await getChal(w.code);if(!c)return;
    const played=c.entries.some(x=>x.you)||quickList().some(q=>q.chal&&q.chal.code===c.code);played?showChallenge(c.code):quick(c)}})}
function weekendMenu(){weekendNow().then(w=>{const el=document.getElementById('wkmenu');if(!el||!w||!(w.open||wkSoon(w)))return;
  el.innerHTML=`<div class="list in" style="--d:1"><button class="lrow" id="wkm" style="border:2px solid var(--ink);background:var(--acc);color:#2A1A0E;padding-left:14px;padding-right:14px"><span>Weekend challenge${w.open?` · ${esc(w.theme)}`:''}</span><span id="wkmcd">${w.open?`closes in ${leftLabel(w.closes-Date.now())} →`:''}</span></button></div>`;
  document.getElementById('wkm').onclick=()=>showJoin();
  if(!w.open)wkCountdown(w,'wkmcd',t=>t.startsWith('starting')?'starting soon':`starts in ${t}`)})}
// a finished challenge game posts its score (one try per person)
async function postChallenge(res){
  if(!res.chal||res.own)return;
  await chalApi({action:'play',code:res.chal.code,name:nameNow(),score:res.total,marks:res.answers.map(markA).join('')});
}

// ---------- confirm popup (resolves true/false) ----------
function confirmBox({title,body,yes,no}){return new Promise(done=>{
  const back=document.activeElement,w=document.createElement('div');w.className='welcome';w.setAttribute('role','alertdialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-labelledby','cft');w.setAttribute('aria-describedby','cfb');
  w.innerHTML=`<div class="box" tabindex="-1"><h2 id="cft" style="font-size:26px">${esc(title)}</h2><p id="cfb">${esc(body)}</p>
    <button class="btn main danger" id="cfy"><span>${esc(yes)}</span></button><button class="btn" id="cfn"><span>${esc(no)}</span></button></div>`;
  document.body.appendChild(w);
  const end=v=>{w.remove();document.removeEventListener('keydown',key);if(back&&back.focus)back.focus();done(v)};
  const key=e=>{if(e.key==='Escape')end(false)};document.addEventListener('keydown',key);
  w.onclick=e=>{if(e.target===w)end(false)};
  document.getElementById('cfn').onclick=()=>end(false);document.getElementById('cfy').onclick=()=>end(true);
  document.getElementById('cfn').focus();
})}
// ---------- first visit: what the game is, and that every size is an approximation ----------
function welcome(then){
  const w=document.createElement('div');w.className='welcome';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-labelledby','wt');
  w.innerHTML=`<div class="box" tabindex="-1">
    <div style="display:flex;align-items:center;gap:10px">${BANANA(30)}<span style="font-weight:700">dailybanana.io</span></div>
    <h2 id="wt">Banana for scale</h2>
    <p>Guess how many of one thing would line up to match another. How many bananas long is a school bus?</p>
    <div class="pt"><span class="ic" aria-hidden="true">≈</span><p><b>Sizes are averages.</b>Picture a typical one. Real things vary.</p></div>
    <div class="pt"><span class="ic" aria-hidden="true">◎</span><p><b>The closer your guess, the more points.</b>6 rounds, 25 seconds each, and a new challenge daily.</p></div>
    <button class="btn main" id="wgo"><span>Let's go</span><span aria-hidden="true">→</span></button>
  </div>`;
  document.body.appendChild(w);
  const go=document.getElementById('wgo');w.querySelector('.box').focus();
  go.onclick=()=>{store.set('welcomed',true);w.remove();then()};
}
const isNew=()=>!store.get('welcomed',false)&&!playedDailies().length&&!quickList().length;

// ---------- boot ----------
document.getElementById('bgb').innerHTML=[[8,14,72,0],[80,8,52,3],[68,38,64,4],[16,62,60,6],[84,70,80,2],[50,88,46,5]].map(([x,y,s,d])=>`<span style="left:${x}%;top:${y}%;--s:${s}px;--d:${d}s">${BANANA(s)}</span>`).join('');
app.innerHTML='<div class="note" style="padding:40px 0">Loading…</div>';
loadData().then(()=>{
  // a daily left mid-round keeps its clock running (see startGame); only an old save without a deadline counts as a pause
  const live=liveSaved(TODAY.n);
  if(live&&!Array.isArray(live.answers))store.del('live:'+TODAY.n);   // an unfinished round from an older version
  else if(live&&live.running&&!live.end){live.running=false;live.pauses++;store.set('live:'+TODAY.n,live)}   // saved by an older version: counts as a pause
  const l2=liveSaved(TODAY.n);
  if(l2&&l2.pauses>MAX_PAUSES&&!saved(TODAY.n)){
    S={r:puzzleFor(TODAY),answers:l2.answers,score:l2.score,pauses:MAX_PAUSES};
    return finish('paused');
  }
  const code=new URLSearchParams(location.search).get('c'),toMenu=new URLSearchParams(location.search).has('menu');   // ?menu comes from the admin page's Menu button
  signInReturn().then(handled=>{
    if(handled)return;
    if(code||toMenu)history.replaceState(null,'',location.pathname);
    const open=()=>code?showChallenge(code):toMenu?showMenu():showStart();
    if(isNew()){showStart();welcome(open)}else open();
    // pull scores from your other devices, then refresh the home screen if it's showing
    if(SESSION)syncNow().then(changed=>{testerCheck();bragCheck();if(changed&&!S&&document.querySelector('.home'))redrawQuietly(showStart)});
  });
  log('visit',{device:DEVICE,src:SRC});
  rescoreV3();testerCheck();bragCheck();backfillGuesses();
}).catch(e=>{
  console.error(e);
  app.innerHTML='<div style="padding:40px 0">Could not load the game data.<div class="note">Check that the data folder is published next to this page.</div></div>';
});
</script>
