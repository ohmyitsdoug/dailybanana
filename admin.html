<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily Banana Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
<script>(function(){var t;try{t=JSON.parse(localStorage.getItem('snug:theme'))}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<style>
:root,:root[data-theme="light"]{--bg:#FFF0A0;--ink:#3B2412;--mut:#6B4F30;--card:#FFFAE0;--line:#E6D38A;--acc:#FFD43B;--accsh:#B97E00;color-scheme:light}
:root[data-theme="dark"]{--bg:#2A1A0E;--ink:#FFF3C9;--mut:#CDB68C;--card:#382415;--line:#4E3622;--acc:#FFD43B;--accsh:#FFD43B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px}
a{color:var(--ink)}
.top{border-bottom:2px solid var(--ink)}
.top>div{max-width:1100px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.logo .a{font-size:12px;padding:1px 6px;border:2px solid var(--ink)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 60px;display:flex;flex-direction:column;gap:14px}
h2{font-weight:500;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:18px 0 0}
.dim{color:var(--mut)} .small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:2px solid var(--ink);background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.stat.big{box-shadow:4px 4px 0 var(--accsh)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card)}
th,td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.5px;color:var(--mut);font-weight:500;border-bottom:2px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
.wrap{overflow-x:auto;border:2px solid var(--ink)}
.msg{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--accsh);padding:10px 12px;font-weight:500;background:var(--card)}
.gate{max-width:420px;margin:80px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit;font-weight:700;height:36px;background:var(--card);color:var(--ink);border:2px solid var(--ink);padding:0 12px;cursor:pointer}
</style>
</head>
<body>
<div id="m"></div>
<script>
// Daily Banana admin: player numbers only. Opens for the account set as ADMIN_EMAIL (Google) or ADMIN_DISCORD_ID (Discord)
// in Netlify, using the sign-in from the game's Menu.
const API=(window.MATRYO_CONFIG&&window.MATRYO_CONFIG.api)||'/.netlify/functions';
const m=document.getElementById('m');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'–':Number(v).toLocaleString('en-US');
const fmtDay=d=>{const [y,mo,dd]=d.split('-');return['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+' '+(+dd)};
let TOKEN='';try{TOKEN=(JSON.parse(localStorage.getItem('snug:session')||'null')||{}).token||''}catch(_){}
const logo='<div class="logo"><img src="favicon.svg" width="24" height="24" alt="">dailybanana <span class="a">ADMIN</span></div>';

function gate(msg){
  m.innerHTML=`<div class="gate">${logo}${msg?`<div class="msg">${esc(msg)}</div>`:''}
    <div class="small dim">Sign in on the game's Menu with your admin account (Google or Discord), then come back here.</div>
    <a href="./" style="font-weight:700">Go to the game →</a></div>`;
}
async function load(){
  if(!TOKEN)return gate();
  m.innerHTML=`<main><div class="dim">Loading…</div></main>`;
  const r=await fetch(`${API}/admin`,{headers:{authorization:'Bearer '+TOKEN}}).catch(()=>null);
  if(!r)return m.innerHTML='<main><div class="msg">Could not reach the server.</div></main>';
  if(r.status===401)return gate('This account isn\'t the admin. Sign in with your admin Google or Discord account on the game\'s Menu.');
  const d=await r.json().catch(()=>null);if(!d||!d.totals)return m.innerHTML='<main><div class="msg">Server error.</div></main>';
  draw(d);
}
function draw({totals:t,days}){
  const today=days[0]||{};
  const stat=(v,label,big)=>`<div class="stat ${big?'big':''}"><b>${v}</b><span>${label}</span></div>`;
  m.innerHTML=`<div class="top"><div>${logo}<div style="flex:1"></div><button id="re">Refresh</button><a href="./" class="small">← Back to game</a></div></div>
  <main>
    <h2>Today</h2>
    <div class="stats">
      ${stat(n(today.visitors),'unique visitors',1)}${stat(n(today.returning),'returning visitors',1)}${stat(n(today.players),'players',1)}
      ${stat(n(today.dailies),'dailies finished')}${stat(n(today.quick),'quick games')}${stat(n(today.avg_points),'avg points per game')}
      ${stat(today.avg_bananas??'–','avg 🍌 per game')}${stat(n(today.shares),'shares copied')}${stat(n(today.challenges),'challenges made')}
    </div>
    <h2>All time</h2>
    <div class="stats">
      ${stat(n(t.unique_visitors),'unique visitors')}${stat(n(t.players),'unique players')}${stat(n(t.games),'total games')}
      ${stat(n(t.dailies),'dailies finished')}${stat(n(t.quick),'quick games')}${stat(n(t.challenge_games),'challenge games')}
      ${stat(n(t.points),'total points')}${stat(n(t.avg_points),'avg points per game')}${stat(t.avg_bananas??'–','avg 🍌 per game')}
      ${stat(n(t.share_results),'results copied')}${stat(n(t.share_challenge),'challenge links copied')}${stat(n(t.challenges),'challenges made')}
      ${stat(n(t.accounts),'accounts')}
    </div>
    <h2>Last 14 days</h2>
    <div class="wrap"><table><thead><tr><th>Day</th><th>Visitors</th><th>Returning</th><th>New</th><th>Players</th><th>Dailies</th><th>Quick</th><th>Points</th><th>Avg pts</th><th>Avg 🍌</th><th>Shares</th><th>Challenges</th><th>Accounts</th></tr></thead>
      <tbody>${days.map(x=>`<tr><td>${fmtDay(x.day)}</td><td>${n(x.visitors)}</td><td>${n(x.returning)}</td><td>${n(x.new_visitors)}</td><td>${n(x.players)}</td><td>${n(x.dailies)}</td><td>${n(x.quick)}</td><td>${n(x.points)}</td><td>${n(x.avg_points)}</td><td>${x.avg_bananas??'–'}</td><td>${n(x.shares)}</td><td>${n(x.challenges)}</td><td>${n(x.accounts)}</td></tr>`).join('')}</tbody></table></div>
    <div class="small dim">Days are Eastern time (players each get the new daily at their own midnight). A visitor is one device; returning = it first visited on an earlier day. 🍌 = a round scoring 90+. Points and averages count dailies and quick games together.</div>
  </main>`;
  document.getElementById('re').onclick=load;
}
load();
</script>
</body>
</html>
