[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# keep the build tools and review files off the public site
[[redirects]]
  from = "/tools/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/review/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/privacy.html#terms"
  status = 301

# one address for everyone, so sign-in redirects always match
[[redirects]]
  from = "https://www.dailybanana.io/*"
  to = "https://dailybanana.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://dailybanana.netlify.app/*"
  to = "https://dailybanana.io/:splat"
  status = 301
  force = true
